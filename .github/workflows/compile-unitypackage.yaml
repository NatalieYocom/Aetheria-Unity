name: Compile SDK Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .unitypackage
        uses: pCYSlI/create-unitypackage@v1.3.0
        with:
          # Path inside the repository to package
          package-path: 'Packages/com.basis.sdk'
          # Desired output filename
          output-path: 'AetheriaSDK.unitypackage'

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaSDK-unitypackage
          path: AetheriaSDK.unitypackage
