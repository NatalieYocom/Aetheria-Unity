name: Compile SDK Package

on: [push]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export .unitypackage
        uses: psubscry/extract-unity-package-action@v1.1
        with:
          project-path: '.'
          package-path: 'Packages/com.basis.sdk'
          output-path: 'Aetheria-SDK.unitypackage'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaSDK-unitypackage
          path: AetheriaSDK.unitypackage
